name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            8.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/puzzle/requirements.txt
      - name: Restore solution
        run: dotnet restore EpicRPGBotCSharp.sln
      - name: Build solution
        run: dotnet build EpicRPGBotCSharp.sln -c Release --no-restore
      - name: Build puzzle replay
        run: dotnet build tools/PuzzleReplay/PuzzleReplay.csproj -c Release
      - name: Run C# tests
        run: dotnet test EpicRPGBot.Tests/EpicRPGBot.Tests.csproj -c Release --no-build --no-restore --logger "trx;LogFileName=tests.trx" --results-directory artifacts/test-results
      - name: Install Python dependencies
        run: python -m pip install -r tools/puzzle/requirements.txt
      - name: Run Python tests
        run: python -m unittest discover -s tools/puzzle/tests -v
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: artifacts/test-results/*.trx
          if-no-files-found: ignore
